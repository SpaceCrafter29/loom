# The initramfs for the LIVE MEDIUM, not for the installed system.
#
# mkarchiso builds this inside the airootfs, and it needs the `archiso` hook:
# that hook is what finds the boot medium, loop-mounts the squashfs and pivots
# into it. Without this file the live image has an ordinary initramfs that
# looks for a root filesystem that does not exist.
#
# The installed system's initramfs is a different thing entirely and is
# configured in rootfs/etc/mkinitcpio.conf.d/loom.conf.
HOOKS=(base udev modconf kms archiso block filesystems)
COMPRESSION="zstd"
