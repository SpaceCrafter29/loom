# Loom :: tmux
#
# The other multiplexer. Setting LOOM_MULTIPLEXER="tmux" in /etc/loom/loom.conf
# starts this instead of zellij, and everything below exists so that the swap
# costs you as little as possible: the same four windows, the same five Alt
# bindings, the same sixteen colours.
#
# The two constraints that shape this file are the two that shape zellij's
# config.kdl, for the same reason -- the session runs on a Linux VT:
#
#   no nerd-font glyphs -- the console font is a PSF bitmap with a few hundred
#                          characters in it, so the status bar is built out of
#                          ASCII rather than powerline separators
#   colour by index     -- colours are colour0-colour15, never hex, so that
#                          /usr/share/loom/console/palette stays the single
#                          place the system's colours are defined
#
# Edit ~/.config/tmux/tmux.conf, not this file. To start from the shipped
# version again:  cp /usr/share/loom/tmux/tmux.conf ~/.config/tmux/tmux.conf
# Reload without restarting the session:  prefix then r

## --- terminal ----------------------------------------------------------------

# tmux rewrites $TERM for everything it runs, so this line decides what the
# applications inside believe they are talking to. On the console they have
# sixteen colours and no more -- the kernel's table is 16 entries -- and a
# program told otherwise emits truecolour the VT then approximates into mud.
# `screen.linux` is the terminfo entry for exactly this case, a multiplexer on
# a Linux VT. In a graphical terminal there is no reason to lie downwards, so
# take the 256 there.
if-shell '[ "$TERM" = linux ] && infocmp screen.linux >/dev/null 2>&1' \
  'set -g default-terminal "screen.linux"' \
  'set -g default-terminal "tmux-256color"'

# Escape is a prefix in every terminal's key encoding and also the key neovim
# reads most. 500ms of ambiguity is the single most complained-about default in
# tmux, and Loom ships neovim as the system editor.
set -sg escape-time 10

set -g focus-events on
set -g set-titles off

## --- session behaviour -------------------------------------------------------

# Matches zellij's scroll_buffer_size, so switching multiplexers does not
# quietly change how far back you can look.
set -g history-limit 20000

# Windows count from 1, because the keys are in that order on the keyboard and
# because zellij's tab bar numbers from 1 too.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# The layout names its windows shell/files/git/sys and the status bar is built
# on those names. A program that renames the window out from under you would
# make the bar lie about where you are.
setw -g allow-rename off
setw -g automatic-rename off

setw -g mode-keys vi
set -g status-keys emacs
set -g display-time 2000

## --- mouse and copying -------------------------------------------------------

# gpm is enabled on the console, so this works on a bare VT and not just in a
# graphical terminal.
set -g mouse on

# zellij's copy_on_select, rebuilt: releasing a drag copies the selection and
# leaves copy mode, rather than making you press a second key.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode-vi v               send -X begin-selection
bind -T copy-mode-vi y               send -X copy-selection-and-cancel

# There is no Wayland or X clipboard behind a VT, so the copy buffer is tmux's
# own and paste is a tmux key. `prefix ]` pastes; `prefix b` lists the buffers.
bind b choose-buffer -Z

## --- colours -----------------------------------------------------------------
#
# Indices only. 0 black, 1 red, 2 green, 3 yellow, 4 blue, 5 magenta, 6 cyan,
# 7 white, 8-15 the bright half. See /usr/share/loom/console/palette.md.

# zellij draws no pane frames. tmux cannot turn its borders off, so they are
# dimmed to the point of being furniture instead.
set -g pane-border-style        "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g pane-border-status off

set -g display-panes-colour        colour8
set -g display-panes-active-colour colour4

set -g message-style       "fg=colour0,bg=colour3,bold"
set -g message-command-style "fg=colour0,bg=colour3"
setw -g mode-style         "fg=colour0,bg=colour6"

## --- status bar --------------------------------------------------------------
#
# One line, ASCII, and short enough to survive an 80-column console. The window
# list is the important half; the clock is there because a full-screen session
# with no desktop has nowhere else to put one.

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "fg=colour7,bg=colour0"

set -g status-left-length  24
set -g status-right-length 48

# Session name, reversed out. It turns yellow while the prefix is held, which
# on a system with no modal status bar is the one piece of state you cannot
# otherwise see.
set -g status-left "#[fg=colour0,bg=colour4,bold]#{?client_prefix,#[bg=colour3],} #S #[default] "

setw -g window-status-format         "#[fg=colour8] #I:#W "
setw -g window-status-current-format "#[fg=colour0,bg=colour7,bold] #I:#W "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=colour3"
setw -g window-status-bell-style     "fg=colour1,bold"

set -g status-right "#[fg=colour8]#h #[fg=colour7]%H:%M #[fg=colour8]%Y-%m-%d "

## --- keys --------------------------------------------------------------------
#
# The prefix stays C-b. Loom does not rebind it for the same reason its zellij
# config leaves zellij's defaults alone: every tmux answer you will ever find
# assumes the default, and a system that reinvents it teaches you keys that
# work nowhere else. Everything here is additive.

# Reload, and say so -- a config you cannot reload is a config you edit less.
# This is your copy; the shipped one is /usr/share/loom/tmux/tmux.conf.
bind r source-file ~/.config/tmux/tmux.conf \; display "loom: config reloaded"

# Splits that say which way they go. % and " still work.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane focus without the prefix, which is how you actually move around.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Windows without the prefix: the tab keys from zellij, near enough.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Resize, repeatable: hold the prefix once and keep tapping.
bind -r H resize-pane -L 4
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 4

## --- Loom's additions --------------------------------------------------------
#
# The same five keys zellij's config binds. zellij opens each in a new pane; on
# an 80x25 console a half-height btop is not worth looking at, so tmux opens a
# window instead and `prefix w` brings you back. tools/check.sh fails the build
# if this list and zellij's fall out of step.

bind -n M-f new-window -n files  "yazi"
bind -n M-g new-window -n git    "lazygit"
bind -n M-m new-window -n sys    "btop"
bind -n M-w new-window -n web    "loomctl web"
bind -n M-h new-window -n health "loomctl health; printf '\\nloom: enter to close '; read _"
