# systemd-boot would happily discover the kernel images on its own, but it
# titles an auto-discovered image from the PRETTY_NAME embedded in it -- and all
# three Loom images embed the same /etc/os-release. The menu would read
# "Arch Linux" three times, with the rescue entry indistinguishable from the
# others precisely when you need to find it.
#
# So the images live in /EFI/loom (which systemd-boot does not scan) and are
# named here instead. There is nothing to keep in sync: the filenames are fixed.
title      Loom
sort-key   10-loom
efi        /EFI/loom/loom-linux.efi
