# The offline rollback path. This image never mounts the root filesystem: it
# stops in early userspace with cryptsetup, btrfs and a rescue shell built into
# the initramfs, which is why it still works when the root filesystem is the
# problem.
#
# Sorted last so it is not something you arrive at by holding the down arrow.
title      Loom Rescue
sort-key   90-loom-rescue
efi        /EFI/loom/loom-rescue.efi
