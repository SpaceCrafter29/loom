#? Loom :: btop
# btop rewrites this file on exit and ignores keys it does not recognise, so it
# is safe to ship an opinionated subset.

color_theme = "Default"

# The Linux console has 16 colours. Asking btop for 24-bit gradients on a TTY
# produces a grey smear; force_tty makes it draw in the palette it actually has.
truecolor = False
force_tty = True

# Terminus has no rounded box-drawing glyphs.
rounded_corners = False
theme_background = False

vim_keys = True
update_ms = 1500
proc_sorting = "cpu lazy"
proc_tree = False
shown_boxes = "cpu mem net proc"
check_temp = True
show_battery = True
