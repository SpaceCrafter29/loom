# Optional: skip the console login prompt on tty1.
#
# Install with:
#   sudo install -Dm644 /usr/share/loom/optional/getty-autologin.conf \
#        /etc/systemd/system/getty@tty1.service.d/autologin.conf
#   sudo sed -i "s/%LOOM_USER%/$USER/" \
#        /etc/systemd/system/getty@tty1.service.d/autologin.conf
#   sudo systemctl daemon-reload
#
# Worth understanding first: full-disk encryption protects the machine when it
# is off. Autologin means that once the disk is unlocked, anyone holding the
# laptop is you. On a machine that travels, leave this alone.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --autologin %LOOM_USER% --noclear %I $TERM
