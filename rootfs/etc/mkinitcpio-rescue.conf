# Initramfs for the "Loom Rescue" boot entry.
#
# This one is deliberately *not* systemd-based and deliberately *not*
# autodetected: it has to boot on hardware whose root filesystem it cannot
# read, which is the whole point. It carries cryptsetup, btrfs and a bash
# rescue shell inside itself, so it never touches the installed system until
# you tell it to. Expect ~80-120 MB.
MODULES=(btrfs)
BINARIES=()
FILES=()
HOOKS=(base udev modconf kms keyboard keymap consolefont block encrypt btrfs filesystems loom-rescue)
COMPRESSION="zstd"
