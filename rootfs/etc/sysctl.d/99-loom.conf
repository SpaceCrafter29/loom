# Tuned for zram swap: with compressed RAM as the swap device, swapping is
# cheap and the kernel's disk-era defaults are far too reluctant.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# Plenty of inotify watches; editors and file watchers eat these.
fs.inotify.max_user_watches = 524288

# Don't let a runaway build take the whole machine down with it.
vm.max_map_count = 1048576
