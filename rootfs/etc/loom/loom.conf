# /etc/loom/loom.conf -- every knob Loom itself reads.
# Sourced by POSIX shell. Keep it to KEY="value"; no command substitution.

LOOM_NAME="Loom"
LOOM_VERSION="2026.09.11"
LOOM_AUTHOR="SpaceCrafter29"
LOOM_URL="https://github.com/SpaceCrafter29/loom"

## --- session -----------------------------------------------------------------
# tty1 runs the multiplexer session. tty2-tty6 are always plain login shells,
# so a broken session config can never lock you out of your own machine.
LOOM_SESSION_AUTOSTART="1"
LOOM_SESSION_TTY="tty1"
# zellij | tmux
LOOM_MULTIPLEXER="zellij"
LOOM_ZELLIJ_SESSION="loom"
LOOM_ZELLIJ_LAYOUT="loom"

## --- graphics on demand ------------------------------------------------------
# Loom never starts a display server at boot. `loomctl gui <app>` launches a
# single-application Wayland compositor on a free VT; `loomctl gui` with no
# argument starts LOOM_GUI_SESSION instead.
LOOM_GUI_COMPOSITOR="cage"
LOOM_GUI_SESSION="river"
LOOM_GUI_BROWSER="firefox"

## --- updates -----------------------------------------------------------------
# Packages are downloaded in the background on a timer so that the upgrade
# itself is a local operation. This is the "fluid" half of fluid updates.
LOOM_PREFETCH="1"
# Take a pre/post Btrfs snapshot around every `loomctl update`.
LOOM_SNAPSHOT_ON_UPDATE="1"
# Rebuild + re-sign unified kernel images after an update. Turning this off on
# a Secure Boot machine will brick the next boot. Leave it alone.
LOOM_REBUILD_UKI="1"
# Refuse to upgrade until unread Arch news has been acknowledged, when the
# `informant` package is installed.
LOOM_REQUIRE_NEWS="1"
# Refresh the mirrorlist with reflector before an upgrade, at most once a day.
LOOM_REFLECTOR="1"
LOOM_REFLECTOR_COUNTRY=""

## --- boot --------------------------------------------------------------------
LOOM_ESP="/efi"
LOOM_UKI_DIR="/efi/EFI/loom"
LOOM_SECUREBOOT="1"

## --- snapshots ---------------------------------------------------------------
# Retention is snapper's own configuration, not Loom's. Editing it here would do
# nothing; the values live in /usr/share/loom/snapper/root.settings and are
# applied with `snapper -c root set-config`. To change them on a running system:
#   sudo snapper -c root set-config NUMBER_LIMIT=20
