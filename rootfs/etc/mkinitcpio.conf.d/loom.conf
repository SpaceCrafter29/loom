# Loom uses a systemd-based initramfs. That is not a style choice: sd-encrypt
# is what lets systemd-cryptsetup read a TPM2 token straight out of the LUKS2
# header, and it is what makes `systemd-cryptenroll` work at all.
MODULES=()
BINARIES=()
FILES=()
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block sd-encrypt filesystems fsck)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-9)
