[Login]
# tty1 is the session; tty2-tty6 are the escape hatch. Six is plenty and
# reserving them up front means they exist before anything goes wrong.
NAutoVTs=6
ReserveVT=6

# On a machine with no desktop environment, nothing else is going to ask you
# whether you meant to press the power button.
HandlePowerKey=poweroff
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleSuspendKey=suspend

# Keep the multiplexer alive across logouts: zellij is the session, and killing
# it on logout would defeat attach-or-create.
KillUserProcesses=no
