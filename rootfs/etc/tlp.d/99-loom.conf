# Loom :: power
#
# Conservative by design. TLP can do considerably more aggressive things to a
# laptop, and most of them are indistinguishable from hardware faults when they
# go wrong.

TLP_ENABLE=1
TLP_DEFAULT_MODE=AC
TLP_PERSISTENT_DEFAULT=0

CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Disk APM: 254 is "do not park the heads", 128 is a reasonable battery value.
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128 128"

# Charge thresholds are a ThinkPad/ASUS/LG-specific firmware feature. Uncomment
# only if `sudo tlp-stat -b` shows that your battery supports them; on hardware
# that does not, TLP logs an error and carries on.
#START_CHARGE_THRESH_BAT0=75
#STOP_CHARGE_THRESH_BAT0=80
